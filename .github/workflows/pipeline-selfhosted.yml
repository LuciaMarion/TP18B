name: CI/CD Pipeline - Notes App DevSecOps (Self-Hosted K8s)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-portfolio
  HELM_RELEASE_NAME: mi-app
  K8S_NAMESPACE: devops-portfolio
  DEFECTDOJO_URL: "http://defectdojo-django.defectdojo.svc.cluster.local"
  DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_API_KEY }}
  PRODUCT_NAME: "Notes App"
  ENGAGEMENT_NAME: "CI/CD Automated Security Audits"

jobs:
  # =========================================================================
  # FASE 1: BUILD & PACKAGE (Construcción de Imagen Inmutable)
  # =========================================================================
  build-and-package:
    name: "Fase 1: Build & Package (Imagen Inmutable)"
    runs-on: self-hosted
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Compilar imagen Docker
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ./backend

  # =========================================================================
  # FASE 2: AUDITORÍAS DE CIBERSEGURIDAD Y GENERACIÓN DE REPORTES JSON
  # =========================================================================
  security-audits:
    name: "Fase 2: Auditorías (Threagile, Semgrep, Trivy, Gitleaks & GHAS JSON)"
    runs-on: self-hosted
    needs: [build-and-package]
    steps:
      - name: Checkout del código (Historial completo para Gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear carpeta para reportes JSON
        run: mkdir -p reports-json

      - name: Asegurar imagen Docker local
        run: |
          if ! docker image inspect ${{ env.DOCKER_IMAGE }}:${{ github.sha }} >/dev/null 2>&1; then
            docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ./backend
          fi

      - name: Instalar Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Renderizar Helm Chart (TP10B - Pattern)
        run: |
          helm template ${{ env.HELM_RELEASE_NAME }} ./devops-portfolio -f devops-portfolio/values-prod.yaml > manifests-rendered-prod.yaml

      # 2A. THREAGILE THREAT MODELING
      - name: Ejecutar Threagile Threat Model Analysis
        uses: threagile/run-threagile-action@v1
        with:
          model-file: 'threagile.yaml'
          output-dir: 'reports-json'
        continue-on-error: true

      - name: Normalizar reporte Threagile para DefectDojo
        run: |
          if [ ! -s "reports-json/risks.json" ]; then
            SRC_FILE=$(find . -maxdepth 3 -name "threagile-results.json" | head -n 1)
            if [ -n "$SRC_FILE" ]; then
              python3 -c '
          import json, sys
          with open(sys.argv[1]) as f:
              data = json.load(f)
          findings = []
          for risk_id, r in data.get("identified_risks", {}).items():
              sev = r.get("severity", "Medium").capitalize()
              if sev == "Very-high":
                  sev = "Critical"
              likelihood = r.get("exploitation_likelihood", "N/A")
              impact = r.get("exploitation_impact", "N/A")
              findings.append({
                  "title": r.get("title", risk_id),
                  "severity": sev,
                  "description": f"Threat Model Risk ({risk_id}) - Likelihood: {likelihood}, Impact: {impact}",
                  "vuln_id_from_tool": risk_id,
                  "static_finding": True
              })
          with open("reports-json/threagile-dd.json", "w") as out:
              json.dump({"findings": findings}, out, indent=2)
          ' "$SRC_FILE"
            fi
          fi

      # 2B. SEMGREP SAST
      - name: Ejecutar Semgrep SAST
        run: |
          python3 -m venv /tmp/semgrep-venv
          /tmp/semgrep-venv/bin/pip install -q semgrep
          /tmp/semgrep-venv/bin/semgrep scan \
            --config=p/owasp-top-10 \
            --config=p/python \
            --config=p/dockerfile \
            --config=p/kubernetes \
            --json -o reports-json/semgrep-results.json . || true

      # 2C. TRIVY CONTAINER & SCA
      - name: Ejecutar Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_IMAGE }}:${{ github.sha }}'
          format: 'json'
          output: 'reports-json/trivy-container-results.json'
          exit-code: '0'

      # 2D. GITLEAKS SECRET SCANNING
      - name: Ejecutar Gitleaks CLI
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks detect --source . --report-format json --report-path reports-json/gitleaks-report.json --exit-code 0

      # 2E. GITHUB NATIVE ALERTS - DEPENDABOT
      - name: Exportar alertas nativas de GitHub (Dependabot)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HTTP_STATUS=$(curl -s -o reports-json/dependabot-alerts.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/dependabot/alerts?state=open")
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Aviso: API de Dependabot devolvió HTTP $HTTP_STATUS. Generando JSON vacío."
            echo "[]" > reports-json/dependabot-alerts.json
          fi

      - name: Publicar Artefacto de Reportes JSON
        uses: actions/upload-artifact@v4
        with:
          name: security-json-reports
          path: reports-json/
          retention-days: 1

  # =========================================================================
  # FASE 3: CENTRALIZACIÓN Y DEDUPLICACIÓN EN OWASP DEFECTDOJO
  # =========================================================================
  defectdojo-import:
    name: "Fase 3: Centralización en DefectDojo (Vulnerability Management)"
    runs-on: self-hosted
    needs: [security-audits]
    steps:
      - name: Descargar Reportes JSON
        uses: actions/download-artifact@v4
        with:
          name: security-json-reports
          path: reports-json

      - name: Reimportar auditorías a DefectDojo API v2
        run: |
          echo "=== Reimportando auditorías a DefectDojo API v2 ==="

          upload_scan() {
            local SCAN_TYPE="$1"
            local FILE_PATH="$2"

            if [ -f "$FILE_PATH" ]; then
              echo "  [+] Reimportando $SCAN_TYPE ($FILE_PATH)..."
              RESPONSE_FILE=$(mktemp)

              HTTP_CODE=$(curl -sS \
                -o "$RESPONSE_FILE" \
                -w "%{http_code}" \
                -X POST "${{ env.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
                -H "Authorization: Token ${{ env.DEFECTDOJO_TOKEN }}" \
                -F "product_name=${{ env.PRODUCT_NAME }}" \
                -F "product_type_name=Research and Development" \
                -F "engagement_name=${{ env.ENGAGEMENT_NAME }}" \
                -F "scan_type=$SCAN_TYPE" \
                -F "commit_hash=${{ github.sha }}" \
                -F "branch_tag=${{ github.ref_name }}" \
                -F "auto_create_context=true" \
                -F "close_old_findings=true" \
                -F "file=@$FILE_PATH")

              RESPONSE=$(cat "$RESPONSE_FILE")
              rm -f "$RESPONSE_FILE"

              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                echo "      [OK] Reimportación exitosa (HTTP $HTTP_CODE)"
              else
                echo "      [FAIL] Reimportación rechazada (HTTP $HTTP_CODE): $RESPONSE"
                return 1
              fi
            else
              echo "  [FAIL] Archivo $FILE_PATH no encontrado"
              return 1
            fi
          }

          if [ -s "reports-json/risks.json" ]; then
            upload_scan "Threagile risks report" "reports-json/risks.json"
          else
            upload_scan "Generic Findings Import" "reports-json/threagile-dd.json"
          fi
          sleep 2
          upload_scan "Semgrep JSON Report" "reports-json/semgrep-results.json"
          sleep 2
          upload_scan "Trivy Scan" "reports-json/trivy-container-results.json"
          sleep 2
          upload_scan "Gitleaks Scan" "reports-json/gitleaks-report.json"
          sleep 2
          upload_scan "Github Vulnerability Scan" "reports-json/dependabot-alerts.json"

  # =========================================================================
  # FASE 4: RELEASE & DEPLOY (Publicación y Despliegue Post-Aprobación)
  # =========================================================================
  deploy-k8s-helm:
    name: "Fase 4: Release & Deploy Helm K8s"
    runs-on: self-hosted
    needs: [build-and-package, security-audits, defectdojo-import]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Asegurar imagen Docker local
        run: |
          if ! docker image inspect ${{ env.DOCKER_IMAGE }}:${{ github.sha }} >/dev/null 2>&1; then
            docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ./backend
          fi

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Etiquetar y Push a Docker Hub
        run: |
          docker tag ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ${{ env.DOCKER_IMAGE }}:latest
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE }}:latest

      - name: Despliegue con Helm en Kubernetes
        run: |
          echo "Desplegando Helm Chart en Kubernetes..."
